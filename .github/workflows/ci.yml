name: Research map checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check published Markdown
        run: python scripts/check_content.py
      - name: Check literature identities and reading ownership
        run: python scripts/research_registry.py check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run teaching examples
        run: |
          python examples/evaluation_lab.py
          python examples/data_audit.py
          python examples/tokenization_lab.py
          python examples/posttraining_lab.py
          python examples/context_lab.py
          python examples/agent_budget_lab.py
          python examples/efficient_reasoning_lab.py
      - name: Check post-training arithmetic
        run: python examples/posttraining_lab.py --self-test
