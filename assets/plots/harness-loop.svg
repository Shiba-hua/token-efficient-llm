<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
<title id="title">Agent harness 的状态、预算与工具闭环</title><desc id="desc">持久状态由上下文构建器选择信息送给模型，模型提出动作，预算检查后执行工具，筛选后的观察更新持久状态。未通过预算检查时进入最终回复。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="600" fill="white"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#111827"><text x="40" y="50" font-size="30" font-weight="700">Harness 决定：看什么、做什么、何时停止</text><text x="40" y="87" font-size="20" fill="#475569">自绘概念图；每次模型调用都进入同一份用量账本。</text>
<g fill="#eff6ff" stroke="#2563eb" stroke-width="2"><rect x="40" y="150" width="220" height="100" rx="10"/><rect x="330" y="150" width="220" height="100" rx="10"/><rect x="620" y="150" width="200" height="100" rx="10"/><rect x="880" y="150" width="200" height="100" rx="10"/><rect x="40" y="390" width="220" height="100" rx="10"/><rect x="880" y="390" width="200" height="100" rx="10"/></g>
<g text-anchor="middle" font-size="23"><text x="150" y="190">持久状态</text><text x="150" y="226" font-size="20">事实、文件、剩余预算</text><text x="440" y="190">上下文构建器</text><text x="440" y="226" font-size="20">只选当前所需信息</text><text x="720" y="190">模型</text><text x="720" y="226" font-size="20">回答或提出动作</text><text x="980" y="190">预算与动作检查</text><text x="980" y="226" font-size="20">预留输入和最大输出</text><text x="980" y="430">执行工具</text><text x="980" y="467" font-size="20">保留完整结果</text><text x="150" y="430">筛选观察</text><text x="150" y="467" font-size="20">摘要字段 + 证据位置</text></g>
<g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M260 200 H317"/><path d="M550 200 H607"/><path d="M820 200 H867"/><path d="M980 250 V377"/><path d="M880 440 H273"/><path d="M150 390 V263"/></g>
<text x="995" y="325" font-size="20" fill="#2563eb">允许</text><rect x="450" y="285" width="270" height="75" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="585" y="331" text-anchor="middle" font-size="23">停止并报告当前结果</text><path d="M880 215 H855 V322 H730" stroke="#c2410c" fill="none" stroke-width="2"/><text x="753" y="307" font-size="19" fill="#9a3412">预算不足</text>
<text x="347" y="426" font-size="21">原始日志留在环境中；模型只读必要字段</text><text x="40" y="551" font-size="21" fill="#475569">用量包含规划、路由、摘要、重试、子 Agent 与最终回复。</text></g></svg>
