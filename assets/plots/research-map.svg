<rect x="480" y="25" width="190" height="70" rx="10" fill="#edf5fc" stroke="#225a8b" stroke-width="1.5"/>
<text x="575" y="67" font-size="18" fill="#143650">固定模型</text>
<rect x="20" y="160" width="190" height="70" rx="10" fill="#edf5fc" stroke="#225a8b" stroke-width="1.5"/>
<text x="115" y="202" font-size="18" fill="#143650">Prompt 与上下文</text>
<rect x="250" y="160" width="190" height="70" rx="10" fill="#edf5fc" stroke="#225a8b" stroke-width="1.5"/>
<text x="345" y="202" font-size="18" fill="#143650">Harness 与工具决策</text>
<rect x="480" y="160" width="190" height="70" rx="10" fill="#edf5fc" stroke="#225a8b" stroke-width="1.5"/>
