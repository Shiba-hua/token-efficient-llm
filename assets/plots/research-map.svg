<g font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">
<rect x="20" y="25" width="190" height="70" rx="10" fill="#edf5fc" stroke="#225a8b" stroke-width="1.5"/>
